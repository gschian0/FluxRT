[project]
name = "fluxrt"
version = "1.0"
requires-python = ">=3.12"
dependencies = [
    "transformers",
    "diffusers",
    "numpy<2.3",
    "nvidia-riva-client>=2.26.0",
    "scipy>=1.10,<1.14",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
